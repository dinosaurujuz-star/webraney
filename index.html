<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Hai Kak!! 🤍</title>

  <style>
    body {
      background: #81b8d4;
      font-family: "Comic Sans MS", Arial, sans-serif;
      text-align: center;
      padding: 40px;
    }

    .box {
      background: #f5bcbd;
      border-radius: 30px;
      padding: 30px;
      max-width: 420px;
      margin: auto;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
    }

    h1 {
      color: #f2f0f0;
    }

    .dog {
      font-size: 60px;
      animation: float 2s ease-in-out infinite;
    }

    @keyframes float {
      0% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
      100% { transform: translateY(0); }
    }

    a {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 25px;
      background: #d4819f;
      color: white;
      text-decoration: none;
      border-radius: 25px;
      font-weight: bold;
    }

    a:hover {
      background: #d4819f;
    }
  </style>
</head>

<body>

  <div class="box">
    <div class="dog">🐶🤍</div>
    <h1>Hai Kakak!</h1>

    <p>
      Ada pesan kecil nih…  
      dibuat pelan-pelan,  
      sambil belajar dan sambil pusing-pusingan🤓
    </p>

    <a href="valentine.html">Buka pesannya 💌</a>
  </div>

</body>
</html>
